[project]
name = "tenderhive"
version = "0.1.0"
description = "TenderHive development workspace"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.118.3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pyright>=1.1.400",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",    # Import-related errors
    "E7",    # Statement-related errors
    "E9",    # Runtime syntax errors
    "F",     # Pyflakes
    "I",     # Import sorting
    "UP",    # Python modernization
    "B",     # Bugbear correctness checks
    "SIM",   # Simplification
    "ASYNC", # Common async programming mistakes
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["contracts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
