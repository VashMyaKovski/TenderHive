name: .NET checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main, 'feat/**']

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build th-gateway and th-web
        run: dotnet build TenderHive.slnx
      - name: Test th-gateway
        run: dotnet test services/th-gateway/tests/TenderHive.Gateway.Tests.csproj --no-build
