name: Development checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.13.8
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pyright
      - run: uv run --locked pytest
      - name: Check model gateway
        working-directory: services/th-modelgw
        run: |
          uv sync --locked
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pyright
          uv run --locked pytest
      - name: Check evaluation runner
        working-directory: services/th-eval
        run: |
          uv sync --locked
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pyright
          uv run --locked pytest
      - name: Check the risk agent
        working-directory: services/th-agents
        run: |
          uv sync --locked
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pyright
          uv run --locked pytest

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example --profile monitoring --profile setup --profile modelgw --profile eval --profile agents config --quiet
      - run: docker compose --env-file .env.example run --build --rm th-eval
      - run: docker compose --env-file .env.example --profile monitoring up --wait --wait-timeout 180
      - run: docker compose --env-file .env.example run --rm kafka-init
      - name: Check monitoring endpoints
        run: |
          curl --fail --silent --show-error --retry 12 --retry-connrefused \
            --header 'Content-Type: application/json' --data '{"resourceMetrics":[]}' \
            http://127.0.0.1:4318/v1/metrics
          curl --fail --silent --show-error --retry 12 --retry-connrefused http://127.0.0.1:9090/-/ready
          curl --fail --silent --show-error --retry 12 --retry-connrefused http://127.0.0.1:3000/api/health
      - name: Start the model gateway
        env:
          OPENROUTER_API_KEY: ci-placeholder
          OPENROUTER_MODEL_TEST: test/chat
        run: |
          docker compose --env-file .env.example up --build --wait --wait-timeout 120 th-modelgw
          curl --fail --silent --show-error http://127.0.0.1:8001/healthz
      - name: Verify evaluation-to-gateway contract
        run: |
          docker compose --env-file .env.example run --rm \
            -e TH_EVAL_DATASET_PATH=datasets/gateway-contract-v1.jsonl \
            -e TH_EVAL_PROMPT_VERSION=ci-unsupported-prompt th-eval run --live
      - name: Print container logs on failure
        if: failure()
        run: docker compose --env-file .env.example --profile monitoring --profile modelgw --profile eval logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env.example --profile monitoring --profile modelgw --profile eval down

  risk-agent-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_FILE: compose.yaml:services/th-agents/tests/compose.yaml
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example --profile agents config --quiet
      - run: docker compose --env-file .env.example up --build --wait --wait-timeout 120 th-agents
      - name: Assess a public procurement clause through A2A
        run: >-
          docker compose --env-file .env.example run --rm --no-deps --entrypoint python th-agents
          -m tender_agents.demo examples/minsk-supply-risk.json
          --url http://th-agents:8000 --timeout 20 --expect-reason penalty_above_threshold
      - name: Print container logs on failure
        if: failure()
        run: docker compose --env-file .env.example --profile agents logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env.example --profile agents down
