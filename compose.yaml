x-th-orchestrator: &th-orchestrator-settings
  profiles: ["orchestrator"]
  build:
    context: .
    dockerfile: services/th-orchestrator/Dockerfile
  env_file:
    - ./services/th-orchestrator/.env.example
    - path: ./services/th-orchestrator/.env
      required: false
  environment:
    TH_ORCHESTRATOR_DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    TH_ORCHESTRATOR_DATABASE_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    TH_ORCHESTRATOR_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

x-th-modelgw: &th-modelgw-settings
  profiles: ["modelgw"]
  build:
    context: ./services/th-modelgw
  env_file:
    - ./services/th-modelgw/.env.example
    - path: ./services/th-modelgw/.env
      required: false
  environment:
    MODEL_GW_PROVIDER: ${MODEL_GW_PROVIDER-openrouter}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY-}
    OPENROUTER_MODEL_TEST: ${OPENROUTER_MODEL_TEST-}
    OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL-}
    OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL-}
    NVIDIA_API_KEY: ${NVIDIA_API_KEY-}
    MODEL_RISK: ${MODEL_RISK-}
    MODEL_GW_MASKING_KEY: ${MODEL_GW_MASKING_KEY-}
    MODEL_GW_POSTGRES_DSN: ${MODEL_GW_POSTGRES_DSN-}
    MODEL_GW_PORT: ${MODEL_GW_PORT:-8000}

x-th-eval: &th-eval-settings
  profiles: ["eval"]
  build:
    context: ./services/th-eval
  env_file:
    - ./services/th-eval/.env.example
    - path: ./services/th-eval/.env
      required: false

x-th-eval-api: &th-eval-api-settings
  <<: *th-eval-settings
  environment:
    TH_EVAL_POSTGRES_DSN: ${TH_EVAL_POSTGRES_DSN-}
    TH_EVAL_BIND_HOST: 0.0.0.0
    TH_EVAL_PORT: ${TH_EVAL_PORT:-8000}

x-th-kb: &th-kb-settings
  profiles: ["kb"]
  build:
    context: ./services/th-kb
  env_file:
    - ./services/th-kb/.env.example
    - path: ./services/th-kb/.env
      required: false
  environment:
    KB_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    KB_EVAL_TOKEN: ${KB_EVAL_TOKEN:-local-demo-kb-eval-token}
    KB_PORT: ${KB_PORT:-8000}

services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:?Set POSTGRES_HOST_PORT in .env}:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 15

  neo4j:
    image: neo4j:5.26.33
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_HOST_PORT:?Set NEO4J_HTTP_HOST_PORT in .env}:7474"
      - "127.0.0.1:${NEO4J_BOLT_HOST_PORT:?Set NEO4J_BOLT_HOST_PORT in .env}:7687"
    volumes: ["neo4j:/data"]
    healthcheck:
      test: ["CMD-SHELL", 'cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1"']
      interval: 10s
      timeout: 10s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["127.0.0.1:${QDRANT_HOST_PORT:?Set QDRANT_HOST_PORT in .env}:6333"]
    volumes: ["qdrant:/qdrant/storage"]
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == HTTP/*' 200 '* ]]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.4.8
    ports: ["127.0.0.1:${REDIS_HOST_PORT:?Set REDIS_HOST_PORT in .env}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  th-modelgw-migrate:
    <<: *th-modelgw-settings
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  th-modelgw:
    <<: *th-modelgw-settings
    ports:
      - "127.0.0.1:${MODEL_GW_HOST_PORT:-8001}:${MODEL_GW_PORT:-8000}"
    depends_on:
      redis:
        condition: service_healthy
      th-modelgw-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "modelgw", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  th-agents:
    profiles: ["agents"]
    build:
      context: .
      dockerfile: services/th-agents/Dockerfile
    env_file:
      - ./services/th-agents/.env.example
      - path: ./services/th-agents/.env
        required: false
    volumes:
      - agents-artifacts:/var/lib/tenderhive/artifacts
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "tender_agents", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  th-orchestrator-migrate:
    <<: *th-orchestrator-settings
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  th-orchestrator:
    <<: *th-orchestrator-settings
    depends_on:
      th-orchestrator-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "tender_orchestrator", "healthcheck"]
      interval: 5s
      timeout: 15s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:${KAFKA_HOST_PORT:?Set KAFKA_HOST_PORT in .env},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["127.0.0.1:${KAFKA_HOST_PORT:?Set KAFKA_HOST_PORT in .env}:9092"]
    volumes: ["kafka:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:4.1.2
    profiles: ["setup", "orchestrator", "integrations", "agents"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    entrypoint: ["/bin/sh", "/opt/tenderhive/create-topics.sh"]
    volumes:
      - ./infra/kafka/create-topics.sh:/opt/tenderhive/create-topics.sh:ro

  th-eval:
    <<: *th-eval-settings
    environment:
      TH_EVAL_REPORT_DIR: /reports
    volumes:
      - eval_reports:/reports

  th-eval-migrate:
    <<: *th-eval-api-settings
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  th-eval-api:
    <<: *th-eval-api-settings
    command: ["serve"]
    depends_on:
      th-eval-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TH_EVAL_HOST_PORT:-8002}:${TH_EVAL_PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-m", "tender_eval", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  th-kb-migrate:
    <<: *th-kb-settings
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  th-kb:
    <<: *th-kb-settings
    ports:
      - "127.0.0.1:${KB_HOST_PORT:-8005}:${KB_PORT:-8000}"
    depends_on:
      th-kb-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "tender_kb", "healthcheck"]
      interval: 5s
      timeout: 15s
      retries: 10
      start_period: 5s

  th-solver-migrate:
    profiles: ["solver"]
    build:
      context: .
      dockerfile: services/th-solver/Dockerfile
    env_file:
      - services/th-solver/.env.example
      - path: services/th-solver/.env
        required: false
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  th-solver:
    profiles: ["solver"]
    build:
      context: .
      dockerfile: services/th-solver/Dockerfile
    env_file:
      - services/th-solver/.env.example
      - path: services/th-solver/.env
        required: false
    depends_on:
      th-solver-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "tender_solver", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: ["monitoring"]
    command: ["--config=/etc/tenderhive/otel-collector.yaml"]
    volumes:
      - ./infra/monitoring/otel-collector.yaml:/etc/tenderhive/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_HOST_PORT:?Set OTEL_GRPC_HOST_PORT in .env}:4317"
      - "127.0.0.1:${OTEL_HTTP_HOST_PORT:?Set OTEL_HTTP_HOST_PORT in .env}:4318"

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["monitoring"]
    volumes:
      - ./infra/monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:${PROMETHEUS_HOST_PORT:?Set PROMETHEUS_HOST_PORT in .env}:9090"]

  grafana:
    image: grafana/grafana:13.3.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./infra/monitoring/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/tenderhive.yaml:ro
      - ./infra/monitoring/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/tenderhive.yaml:ro
      - ./infra/monitoring/dashboards:/var/lib/grafana/dashboards/tenderhive:ro
    ports: ["127.0.0.1:${GRAFANA_HOST_PORT:?Set GRAFANA_HOST_PORT in .env}:3000"]

  mail-sandbox:
    image: greenmail/standalone:2.1.8
    profiles: ["integrations"]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users.login=email
        -Dgreenmail.users=demo:demo-mail-only@example.test
    ports:
      - "127.0.0.1:${TH_INTEGRATIONS_SMTP_HOST_PORT:-3025}:3025"

  th-integrations-migrate:
    profiles: ["integrations"]
    build:
      context: .
      dockerfile: services/th-integrations/Dockerfile
    env_file:
      - ./services/th-integrations/.env.example
      - path: ./services/th-integrations/.env
        required: false
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  th-integrations:
    profiles: ["integrations"]
    build:
      context: .
      dockerfile: services/th-integrations/Dockerfile
    env_file:
      - ./services/th-integrations/.env.example
      - path: ./services/th-integrations/.env
        required: false
    ports:
      - "127.0.0.1:${TH_INTEGRATIONS_HOST_PORT:-8003}:${TH_INTEGRATIONS_PORT:-8000}"
    depends_on:
      th-integrations-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mail-sandbox:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "tender_integrations", "healthcheck"]
      interval: 5s
      timeout: 8s
      retries: 10
      start_period: 5s

volumes:
  postgres:
  neo4j:
  qdrant:
  kafka:
  eval_reports:
  agents-artifacts:
