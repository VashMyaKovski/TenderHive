services:
  th-agents-tests:
    profiles: ["agents"]
    build:
      context: .
      dockerfile: services/th-agents/Dockerfile
      target: test
    environment:
      TH_AGENTS_TEST_REDIS_URL: redis://redis:6379/1
      TH_AGENTS_TEST_KAFKA_BROKERS: kafka:29092
      TH_AGENTS_TEST_ORIGIN: http://th-agents:8000
      TH_AGENTS_TEST_ARTIFACT_TOKEN: replace-with-local-demo-token
    depends_on:
      th-agents:
        condition: service_healthy

  th-agents:
    environment:
      TH_AGENTS_MODEL_GATEWAY_URL: http://th-agents-gateway-stub:8000
    depends_on:
      th-agents-gateway-stub:
        condition: service_healthy

  th-agents-gateway-stub:
    profiles: ["agents"]
    build:
      context: .
      dockerfile: services/th-agents/Dockerfile
      target: test
    entrypoint: ["python", "-m", "uvicorn", "tests.gateway_stub:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    command: []
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
