[project]
name = "th-docintel"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.118.3",
    "grpcio>=1.81.2,<2",
    "pillow>=12.0.0",
    "protobuf>=6.33.5,<7",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.26.0,<2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.81.2,<2",
    "httpx>=0.28.1",
    "pyright>=1.1.400",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["tender_docintel/proto"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["contracts", "tender_docintel"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["tender_docintel", "tests"]
extraPaths = ["../.."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
