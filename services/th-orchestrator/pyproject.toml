[project]
name = "th-orchestrator"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "a2a-sdk==1.3.1",
    "aiokafka==0.15.0",
    "fastapi>=0.118.3",
    "httpx>=0.28.1",
    "langgraph==1.2.24",
    "langgraph-checkpoint-postgres==3.2.1",
    "psycopg[binary,pool]==3.3.9",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.14.2",
    "redis>=7,<9",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1", "ruff>=0.14", "pyright>=1.1.400"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["contracts", "tender_orchestrator"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["tender_orchestrator", "tests"]
extraPaths = ["../.."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
