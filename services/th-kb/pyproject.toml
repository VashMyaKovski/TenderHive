[project]
name = "th-kb"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.118.3",
    "httpx>=0.28.1",
    "neo4j>=5.28.0",
    "psycopg[binary,pool]>=3.3.2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.14.2",
    "redis>=6.4.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4",
    "pytest-asyncio>=1",
    "ruff>=0.14",
    "pyright>=1.1.400",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["th_kb"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["th_kb", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
