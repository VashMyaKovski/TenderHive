[project]
name = "th-modelgw"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography>=46,<48",
    "fastapi>=0.118.3",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.40,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.40,<2",
    "opentelemetry-sdk>=1.40,<2",
    "pillow>=12.0,<13",
    "psycopg[binary]==3.3.9",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.14.2",
    "redis>=7,<9",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = ["pyright>=1.1.400", "pytest>=8.4", "pytest-asyncio>=1", "ruff>=0.14"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["modelgw"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["modelgw", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
